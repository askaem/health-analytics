# Additive overlay for the existing /opt/health-analytics/compose.yaml.
# Start with: docker compose -f compose.yaml -f compose.metabase.yaml up -d metabase
services:
  metabase:
    image: metabase/metabase:v0.64.2.8
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase_app
      MB_DB_USER: metabase_app
      MB_DB_PASS: ${METABASE_APP_PASSWORD:?Define METABASE_APP_PASSWORD in .env}
      MB_ENCRYPTION_SECRET_KEY: ${METABASE_ENCRYPTION_KEY:?Define METABASE_ENCRYPTION_KEY in .env}
      MB_SESSION_SECRET_KEY: ${METABASE_SESSION_SECRET_KEY:?Define METABASE_SESSION_SECRET_KEY in .env}
      JAVA_OPTS: "-Xms256m -Xmx1024m"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - health-net
